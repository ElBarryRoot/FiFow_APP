services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fifow
      POSTGRES_USER: fifow
      POSTGRES_PASSWORD: fifow_local_password
    ports:
      - "5432:5432"
    volumes:
      - fifow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fifow -d fifow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - fifow_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  fifow_postgres_data:
  fifow_redis_data:
